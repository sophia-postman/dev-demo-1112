$kind: http-example
request:
  url: "{{baseUrl}}/refunds"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Ocp-Apim-Subscription-Key
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  body:
    type: json
    content: |-
      {
        "intentId": "string",
        "amountCents": 0,
        "reason": "duplicate"
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "refundId": "re_8821",
        "status": "succeeded",
        "amountCents": 0
      }
order: 1000
